<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>AI Pre-Flight — request access</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
    :root {
      --bg: #eef1ee;
      --ink: #16211d;
      --ink-soft: #4c5a52;
      --accent: #1f6f6b;
      --surface: #ffffff;
      --line: #cad3c8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background: var(--bg);
      color: var(--ink);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 32px 28px;
      box-shadow: 0 1px 2px rgba(20, 30, 25, 0.06), 0 6px 16px rgba(20, 30, 25, 0.05);
    }
    .eyebrow {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 10px;
    }
    h1 {
      font-family: Archivo, system-ui, sans-serif;
      font-size: 1.55rem;
      margin: 0 0 12px;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 14px;
      color: var(--ink-soft);
      line-height: 1.5;
      font-size: 0.95rem;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }
    a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid transparent;
    }
    a.btn-primary {
      background: var(--accent);
      color: #fff;
    }
    a.btn-primary:hover { filter: brightness(1.05); }
    a.btn-ghost {
      background: transparent;
      color: var(--ink);
      border-color: var(--line);
    }
    a.btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">AI Pre-Flight</p>
    <h1>Checklist is not public</h1>
    <p>
      The full interactive Pre-Flight board is shared privately on request —
      it is a working tool, not a public download.
    </p>
    <p>
      If you would like access, use the contact form on my portfolio and say
      you are asking about AI Pre-Flight.
    </p>
    <div class="actions">
      <a class="btn btn-primary" href="/#contact">Contact me</a>
      <a class="btn btn-ghost" href="/projects/ai-preflight">Back to project</a>
    </div>
  </div>
</body>
</html>
